buildscript {
    repositories {
        maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.hasProperty('mod_version') ? mod_version : '1.0.0'
group = project.hasProperty('mod_group_id') ? mod_group_id : 'com.example'

base {
    archivesName = project.hasProperty('mod_id') ? mod_id : 'my_mod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

minecraft {
    mappings channel: project.hasProperty('mapping_channel') ? mapping_channel : 'official', version: project.hasProperty('mapping_version') ? mapping_version : '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', project.hasProperty('mod_id') ? mod_id : 'my_mod'
        }

        server {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', project.hasProperty('mod_id') ? mod_id : 'my_mod'
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', project.hasProperty('mod_id') ? mod_id : 'my_mod', '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${project.minecraft_version}:${project.geckolib_version}")
    implementation("com.eliotlash.mclib:mclib:20")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: project.hasProperty('minecraft_version') ? minecraft_version : '1.20.1',
            mod_id           : project.hasProperty('mod_id') ? mod_id : 'my_mod',
            mod_name         : project.hasProperty('mod_name') ? mod_name : 'My Mod',
            mod_version      : project.hasProperty('mod_version') ? mod_version : '1.0.0',
            mod_authors      : project.hasProperty('mod_authors') ? mod_authors : 'Author'
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : project.hasProperty('mod_id') ? mod_id : 'my_mod',
                'Specification-Vendor'   : project.hasProperty('mod_authors') ? mod_authors : 'Author',
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : project.hasProperty('mod_authors') ? mod_authors : 'Author',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}